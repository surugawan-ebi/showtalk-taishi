name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-matrix:
    name: verify (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "26.x"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --engine-strict

      - name: Verify types, tests, build, and package contents
        run: npm run verify

      - name: Audit production dependencies
        run: npm audit --omit=dev

  verify:
    name: verify
    if: ${{ always() }}
    needs:
      - verify-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every matrix verification to succeed
        env:
          VERIFY_MATRIX_RESULT: ${{ needs.verify-matrix.result }}
        run: |
          case "$VERIFY_MATRIX_RESULT" in
            success)
              echo "All matrix verification jobs succeeded."
              ;;
            failure|cancelled|skipped)
              echo "::error::Matrix verification result: $VERIFY_MATRIX_RESULT"
              exit 1
              ;;
            *)
              echo "::error::Matrix verification did not return a known successful result."
              exit 1
              ;;
          esac
